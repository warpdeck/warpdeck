<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarpDeck</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Black background */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            overflow: hidden; /* Prevent scrollbars if logo is large */
        }
        img {
            max-width: 90%; /* Prevent logo from exceeding screen width */
            max-height: 90%; /* Prevent logo from exceeding screen height */
            display: block; /* Remove extra space below image */
        }
    </style>
</head>
<body>
    <img src="assets/warpdeck-square-logo.svg" alt="WarpDeck Logo">
</body>
</html>
