<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarpDeck</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Black background */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            overflow: hidden; /* Prevent scrollbars if logo is large */
        }
        img {
            max-width: 70%; /* Prevent logo from exceeding screen width */
            max-height: 70%; /* Prevent logo from exceeding screen height */
            display: block; /* Remove extra space below image */
            transition: 0.3s; /* Add transition for scaling effect */
            opacity: 0.9; /* Set initial opacity */
        }
        img:hover {
            transform: scale(1.1); /* Scale image on hover */
            opacity: 1; /* Full opacity on hover */
        }
        a {
            display: flex; /* Make the link a flex container */
            justify-content: center; /* Center the image horizontally */
            align-items: center; /* Center the image vertically */
            /* Apply similar constraints to the link as the image had */
        }
    </style>
</head>
<body>
    <a href="https://x.com/warpdeck" target="_blank" rel="noopener noreferrer">
        <img src="assets/warpdeck-square-logo.svg" alt="WarpDeck Logo">
    </a>
</body>
</html>
